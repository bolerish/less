<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Less — Open a website</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px/1.6 system-ui,
          sans-serif;
        background: #fff;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #111;
          color: #eee;
        }
      }
      main {
        max-width: 32rem;
        margin: 12vh auto;
        padding: 24px;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 data-message="panel_unavailable_heading">Less could not open on this page</h1>
      <p data-message="panel_unavailable_action">
        Open a website, then click the Less icon in your browser toolbar.
      </p>
      <p data-message="panel_unavailable_protected">
        Less cannot open its panel on browser settings, extension stores or other protected pages.
      </p>
      <p data-message="panel_unavailable_reload">
        If you just installed or updated Less, reload the website and try again. Your saved hiding
        rules are kept.
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
